name: Deploy Front Docker

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - master
    paths:
      - 'frontend/**'

jobs:
  deploy_front:
    if: github.repository == 'ldurans/izing.open.io'
    runs-on: ubuntu-22.04 
    environment: production 
    steps:
      - name: "Checkout" 
        uses: actions/checkout@v4

      - name: "Use NodeJS"          
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
    
      - name: Verify Bun version
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ./frontend

      - name: Build Frontend
        run: |
          cd frontend
          bun run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: izingopenio
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 -t izingopenio/izingopenio-frontend:latest --push ./frontend
