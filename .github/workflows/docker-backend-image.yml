name: Deploy Back Docker

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - master
    paths:
      - 'backend/**'

jobs:
  deploy_back:
    if: github.repository == 'ldurans/izing.open.io'
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Use Node.js"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: "Verify Bun version"
        run: bun --version

      - name: Build Backend
        run: |
            cd backend
            PUPPETEER_SKIP_DOWNLOAD=true PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true bun install --frozen-lockfile
            export NODE_OPTIONS="--max_old_space_size=4096"
            CI=false bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: izingopenio
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 -t izingopenio/izingopenio-backend:latest --push ./backend
